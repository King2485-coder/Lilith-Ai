#####################################################################
# Lilith Private LTE - eNodeB Node 1 Configuration
# Primary cell for User A
#####################################################################

[enb]
enb_id = 0x1A2
mcc = 001
mnc = 01
mme_addr = 127.0.0.2
gtp_bind_addr = 172.20.0.20
s1c_bind_addr = 172.20.0.20
s1c_bind_port = 36412
name = lilith-enb-node1
tac = 1

# PHY configuration
n_prb = 50
tx_gain = 80
rx_gain = 40

# Cell configuration
cell_id = 1
tac = 1
dl_earfcn = 3350
ul_earfcn = 20350
dl_freq = 2680e6
ul_freq = 2560e6

# Antenna configuration
tx_ports = 1
rx_ports = 1

# eMBMS configuration (disabled)
embs = 0

[phy]
# Physical layer settings
nof_phy_threads = 2
tx_amplitude = 0.6

[rf]
# RF frontend device configuration
device_name = zmq
device_args = "tx_port=tcp://*:2000,rx_port=tcp://localhost:2001,id=enb-node1,broker_addr=tcp://172.20.0.100:5555"
tx_freq = 2680e6
rx_freq = 2560e6
tx_gain = 80
rx_gain = 40
srate = 11.52e6

[rrc]
# Radio Resource Control
release = 13
# UE inactivity timer (seconds)
inactivity_timer = 30

# Cell selection criteria
q_rx_lev_min = -120
q_qual_min = -20
s_intra_search = 62
s_nonintra_search = 10

[mac]
# MAC layer configuration
rlc_mode = um
log_level = info

[scheduler]
# Scheduling algorithm
sched_policy = time_rr
max_aggr_level = 3

[s1ap]
# S1-AP configuration
mme_addr = 127.0.0.2
enb_bind_addr = 172.20.0.20
mme_s1c_port = 36412

[gtp]
# GTP-U configuration
gtp_bind_addr = 172.20.0.20

[log]
# Logging configuration
filename = /var/log/srsran/enb_node1.log
file_max_size = -1
all_level = info
s1ap_level = debug
rrc_level = debug

[gw]
# Packet gateway (internal)
ipnet = 10.45.0.0/16

[embms]
# eMBMS configuration (disabled)
enable = false

[cfi]
# Control Format Indicator
cfi = 2

[trace]
# Trace configuration
enable = false
