#####################################################################
# Lilith Private LTE - UE Configuration: User B (222)
# IMSI: 001010000000002
#####################################################################

[usim]
# USIM configuration
mode = soft
imsi = 001010000000002
imei = 353490069873191
k = 11223344556677889900AABBCCDDEEFF
opc = 101112131415161718191A1B1C1D1E1F
amf = 0x9001
duplex_mode = FDD
# Use OPc instead of OP
using_op = 0

[rrc]
# RRC configuration
release = 13
cell_select_win = 3

[nas]
# NAS configuration
apn = lilith
apn_protocol = ipv4
force_imsi_attach = true

# SMS configuration
sms_service_center = +001111111
sms_over_nas = true

[phy]
# Physical layer configuration
nof_rx_antennas = 1

[rf]
# RF frontend configuration
device_name = zmq
device_args = "tx_port=tcp://*:2201,rx_port=tcp://localhost:2100,id=ue-userb,broker_addr=tcp://172.20.0.100:5555"
tx_freq = 2700e6
rx_freq = 2580e6
tx_gain = 70
rx_gain = 30
srate = 11.52e6

[log]
# Logging
filename = /var/log/srsran/ue_userb.log
file_max_size = -1
all_level = info
rrc_level = debug
nas_level = debug

[gw]
# Gateway configuration
ipnet = 10.45.0.0/16

[general]
# General settings
single_tx = true

[sim]
# Simulation settings
enable_mib_decode = true
enable_sib_decode = true

[sensors]
# Sensor measurements
enable = false
