#####################################################################
# Lilith Private LTE - Radio Bearer Configuration
#####################################################################

# SRB1 - Signaling Radio Bearer 1
srb1_config {
    rlc_config {
        ul_um {
            sn_field_length: 10
        }
        dl_um {
            sn_field_length: 10
            t_reordering: 45
        }
    }
    logical_channel_config {
        priority: 1
        prioritized_bit_rate: INFINITY
        bucket_size_duration: 50
        logical_channel_group: 0
    }
}

# SRB2 - Signaling Radio Bearer 2
srb2_config {
    rlc_config {
        ul_um {
            sn_field_length: 10
        }
        dl_um {
            sn_field_length: 10
            t_reordering: 45
        }
    }
    logical_channel_config {
        priority: 3
        prioritized_bit_rate: INFINITY
        bucket_size_duration: 50
        logical_channel_group: 0
    }
}

# DRB - Data Radio Bearer for SMS Traffic
drb_config {
    drb_id: 1
    rlc_config {
        ul_um {
            sn_field_length: 10
        }
        dl_um {
            sn_field_length: 10
            t_reordering: 45
        }
    }
    logical_channel_config {
        priority: 5
        prioritized_bit_rate: 8
        bucket_size_duration: 50
        logical_channel_group: 2
    }
    pdcp_config {
        discard_timer: INFINITY
        status_report_required: false
        header_compression: NOT_USED
    }
}

# EPS bearer QoS configuration
eps_bearer {
    qci: 9
    priority: 1
    pre_emption_capability: MAY_TRIGGER_PRE_EMPTION
    pre_emption_vulnerability: PRE_EMPTABLE
}
