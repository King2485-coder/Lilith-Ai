#####################################################################
# Lilith Private LTE - Radio Resource Configuration: Node 1
#####################################################################

# MAC layer scheduling
mac_scheduler {
    scheduling_request_period: 10
    bwps {
        bwp_id: 0
        vrb_to_prb_mapping: NON_INTERLEAVED
        cyclic_prefix: NORMAL
    }
}

# RLC configuration
rlc {
    mode: UM
    um_window_size: 16
    um_sn_field_length: SIZE_5_BITS
}

# PDCP configuration
pdcp {
    discard_timer: INFINITY
    status_report_required: false
    sn_size: SIZE_12_BITS
}

# SDAP configuration
sdap {
    default_drb: true
}

# DRB configuration
drb {
    drb_id: 1
    lc_id: 4
    five_qi: 9
    pdcp_sn_size_ul: SIZE_12_BITS
    pdcp_sn_size_dl: SIZE_12_BITS
    rlc_mode: UM
    um_sn_size: SIZE_5_BITS
}

# SRB configuration
srb {
    srb_id: 1
    rlc_mode: TM
}

# PDSCH configuration
pdsch {
    dmrs_typeA_position: POS2
    pdsch_mapping_type: TYPE_A
    pdsch_aggregation_factor: 1
    rate_matching_mode: NONE
    prb_bundling_type: STATIC_BUNDLING
    vrb_to_prb_interleaver: NONE
    resource_allocation: TYPE_0
}

# PUSCH configuration
pusch {
    dmrs_typeA_position: POS2
    pusch_mapping_type: TYPE_A
    transform_precoding: ENABLED
    codebook_subset: FULLY_AND_PARTIAL_AND_NON_COHERENT
    max_rank: 1
}

# PDCCH configuration
pdcch {
    search_space_id: 1
    coreset_id: 1
    monitoring_symbols_in_slot: [0]
    duration: 1
    aggregation_level: 4
}

# CSI configuration
csi {
    report_period_ms: 10
    csi_rs_resource_bm: [15]
    csi_im_resource: 0
    pmi_codebook_subset: I2_2
    csi_report_quantity: CRI_RI_PMI_CQI
}

# SCell configuration (empty - single cell)
scell_list {
}

# Neighbor cells for measurement
neigh_cell_list {
    pci: 2
    q_offset: 0
    freq: 2700
}
