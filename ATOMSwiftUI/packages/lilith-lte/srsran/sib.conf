#####################################################################
# Lilith Private LTE - SIB (System Information Block) Configuration
#####################################################################

# SIB1 - Cell Access and Selection
sib1 {
    cell_access_related_info {
        plmn_identity_list {
            plmn_identity {
                mcc: 0, 0, 1
                mnc: 0, 1
                cell_reserved_for_operator_use: NOT_RESERVED
            }
            tracking_area_code: 0, 0, 0, 1
            cell_identity: 0, 0, 0, 0, 0, 1
        }
        cell_barred: NOT_BARRED
        intra_freq_reselection: ALLOWED
        csg_indication: false
        csg_identity: 0
    }
    cell_selection_info {
        q_rx_lev_min: -120
        q_rx_lev_min_offset: 0
        p_max: 23
        q_qual_min: -20
        q_qual_min_offset: 0
    }
    p_max: 23
    freq_band_indicator: 7
    scheduling_info_list {
        si_periodicity: 8
        sib_mapping_info {
            sib_type: SIB3
        }
    }
    si_window_length: 1
    system_info_value_tag: 0
}

# SIB2 - Radio Resource Configuration
sib2 {
    ac_barring_info {
        ac_barring_for_emergency: false
        ac_barring_for_mo_signaling {
            ac_barring_factor: 0
            ac_barring_time: 4
            ac_barring_for_special_ac: 0, 0, 0, 0, 0
        }
        ac_barring_for_mo_data {
            ac_barring_factor: 0
            ac_barring_time: 4
            ac_barring_for_special_ac: 0, 0, 0, 0, 0
        }
    }
    radio_resource_config_common {
        rach_config_common {
            preamble_info {
                number_of_ra_preambles: 52
            }
            power_ramping_params {
                power_ramping_step: DB4
                preamble_initial_received_target_power: DMRS_108
            }
            ra_supervision_info {
                preamble_trans_max: N10
                ra_response_window_size: SF10
                mac_contention_resolution_timer: SF48
            }
            max_harq_msg3_tx: 4
        }
        bcch_config {
            modification_period_coeff: N2
        }
        pcch_config {
            default_paging_cycle: RF128
            nB: ONE_T
        }
        prach_config {
            root_sequence_index: 0
            prach_config_info {
                prach_config_index: 3
                high_speed_flag: false
                zero_correlation_zone_config: 1
                prach_freq_offset: 2
            }
        }
        pdsch_config_common {
            reference_signal_power: -50
            p_b: 0
        }
        pusch_config_common {
            pusch_config_basic {
                n_sb: 1
                hopping_mode: INTER_SUBFRAME
                pusch_hopping_offset: 0
                enable64_qam: true
            }
            ul_reference_signals_pusch {
                group_hopping_enabled: false
                group_assignment_pusch: 0
                sequence_hopping_enabled: false
                cyclic_shift: 0
            }
        }
        pucch_config_common {
            delta_pucch_shift: DS1
            n_rb_cqi: 2
            n_cs_an: 0
            n1_pucch_an: 12
        }
        sounding_rs_ul_config_common {
            present: RELEASE
        }
        uplink_power_control_common {
            p0_nominal_pusch: -70
            alpha: AL1
            p0_nominal_pucch: -96
            delta_flist_pucch {
                delta_f_pucch_format1: DELTA_F_0
                delta_f_pucch_format1b: DELTA_F_3
                delta_f_pucch_format2: DELTA_F_1
                delta_f_pucch_format2a: DELTA_F_2
                delta_f_pucch_format2b: DELTA_F_2
            }
            delta_preamble_msg3: 6
        }
        ul_cyclic_prefix_length: LEN1
    }
    ue_timers_and_constants {
        t300: MS1000
        t301: MS600
        t310: MS1000
        n310: N20
        t311: MS5000
        n311: N1
        t304: MS2000
    }
    freq_info {
        additional_spectrum_emission: 1
    }
    time_alignment_timer_common: INFINITY
}

# SIB3 - Intra-frequency Cell Reselection
sib3 {
    cell_reselection_info_common {
        q_hyst: DB4
    }
    cell_reselection_serving_freq_info {
        s_non_intra_search: 10
        thresh_serving_low_q: 0
        cell_resel_priority: 6
        s_intra_search: 31
        s_intra_search_q: 0
        s_non_intra_search_q: 0
        thresh_serving_low_q: 0
    }
    intra_freq_cell_reselection_info {
        q_rx_lev_min: -120
        s_intra_search: 31
        presence_antenna_port1: false
        neigh_cell_config: 0, 0
        t_resel_eutra: 1
        t_resel_eutra_sf {
            sf_medium: ODOT25
            sf_high: ODOT5
        }
    }
}
