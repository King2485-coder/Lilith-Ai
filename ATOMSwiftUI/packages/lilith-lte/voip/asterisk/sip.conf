; =============================================================================
; Lilith Private LTE - Asterisk SIP Configuration
; =============================================================================

[general]
context=from-lte
disallow=all
allow=ulaw
allow=alaw
allow=g729
bindaddr=0.0.0.0
bindport=5060
tcpenable=yes
srvlookup=yes
relaxdtmf=yes
rtptimeout=60
rtpholdtimeout=300
rtpkeepalive=30

; NAT settings
nat=yes
externip=172.20.0.30
localnet=172.20.0.0/16
localnet=10.45.0.0/16

; Security
allowguest=no
alwaysauthreject=yes

; T38 fax
t38pt_udptl=yes

; =============================================================================
; SIP User Accounts
; =============================================================================

; User A - MSISDN 111
[user_a]
type=friend
context=from-internal
host=dynamic
secret=lilith_user_a_2024
disallow=all
allow=ulaw
allow=alaw
callerid="User A" <111>
mailbox=111@default
canreinvite=no
nat=yes
dtmfmode=rfc2833
qualify=yes

; User B - MSISDN 222
[user_b]
type=friend
context=from-internal
host=dynamic
secret=lilith_user_b_2024
disallow=all
allow=ulaw
allow=alaw
callerid="User B" <222>
mailbox=222@default
canreinvite=no
nat=yes
dtmfmode=rfc2833
qualify=yes

; =============================================================================
; LTE Network Trunk
; =============================================================================

; MME/Volte Gateway connection
[lte_trunk]
type=peer
context=from-lte
host=172.20.0.10
port=5060
disallow=all
allow=ulaw
allow=alaw
insecure=port,invite
canreinvite=no
nat=yes
dtmfmode=rfc2833
qualify=yes

; =============================================================================
; Operator Lilith (Virtual Extension)
; =============================================================================
[lilith_operator]
type=friend
context=lilith_operator
host=dynamic
secret=lilith_op_2024
disallow=all
allow=ulaw
allow=alaw
callerid="Operator Lilith" <0>
canreinvite=no
nat=yes
dtmfmode=rfc2833
qualify=yes
musicclass=default
