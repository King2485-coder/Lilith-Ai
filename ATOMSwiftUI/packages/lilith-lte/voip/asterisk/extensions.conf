; =============================================================================
; Lilith Private LTE - Asterisk Dial Plan
; Voice Redirect Service for Operator Lilith
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no
priorityjumping=no

[globals]
; Lilith network settings
LILITH_CARRIER=LILITH
LILITH_SIP_DOMAIN=lilith-pvt-lte.local

; =============================================================================
; Internal SIP Users
; =============================================================================
[from-internal]
; User A (111)
exten => 111,1,NoOp(Call to User A)
 same => n,Dial(SIP/user_a)
 same => n,Hangup()

; User B (222)
exten => 222,1,NoOp(Call to User B)
 same => n,Dial(SIP/user_b)
 same => n,Hangup()

; Operator Lilith (dial 0)
exten => 0,1,NoOp(Call to Operator Lilith - Voice Redirect)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(lilith_greeting)
 same => n,Read(FOCUS_STATE,lilith_focus_prompt,20,,,5)
 same => n,NoOp(User selected focus state: ${FOCUS_STATE})
 same => n,AGI(lilith_process_focus.agi,${FOCUS_STATE},${CALLERID(num)})
 same => n,Playback(lilith_thankyou)
 same => n,Hangup()

; Conference bridge
exten => 9000,1,NoOp(Lilith Conference Bridge)
 same => n,Answer()
 same => n,ConfBridge(lilith_main)
 same => n,Hangup()

; Echo test
exten => *43,1,NoOp(Echo Test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; =============================================================================
; Inbound from LTE Network
; =============================================================================
[from-lte]
; Route based on dialed number
exten => _X.,1,NoOp(Inbound LTE call to ${EXTEN})
 same => n,GotoIf($["${EXTEN}" = "0"]?lilith_operator,1)
 same => n,GotoIf($["${EXTEN}" = "111"]?from-internal,111,1)
 same => n,GotoIf($["${EXTEN}" = "222"]?from-internal,222,1)
 same => n,Playback(invalid)
 same => n,Hangup()

[lilith_operator]
exten => 1,1,NoOp(Lilith Operator Service)
 same => n,Answer()
 same => n,Background(lilith_greeting)
 same => n,WaitExten(10)

; =============================================================================
; Emergency and Special Routes
; =============================================================================
[special]
; Voicemail
exten => *98,1,NoOp(Voicemail access)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; Status check
exten => *611,1,NoOp(Network status)
 same => n,Answer()
 same => n,Playback(lilith_status)
 same => n,SayNumber(${CALLERID(num)})
 same => n,Playback(lilith_network_status_ok)
 same => n,Hangup()
